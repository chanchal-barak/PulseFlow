version: "3.9"

services:

  db:

    image: postgres:16

    container_name: pulseflow-db

    restart: always

    environment:

      POSTGRES_USER: pulseflow

      POSTGRES_PASSWORD: pulseflow

      POSTGRES_DB: pulseflow

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: